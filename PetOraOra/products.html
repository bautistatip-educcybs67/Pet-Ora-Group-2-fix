<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetOra - Products</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}
body {
  background-color: #fff;
  color: #333;
}
a {
  text-decoration: none;
  color: inherit;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 50px;
  background-color: #fff;
  border-bottom: 1px solid #eee;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-links {
  display: flex;
  list-style: none;
  gap: 25px;
}
.nav-links li a {
  font-size: 13px;
  color: #555;
  font-weight: 500;
}
.nav-links li a:hover,
.nav-links li a.active {
  color: #000;
  font-weight: bold;
}
.auth-links {
  display: flex;
  gap: 15px;
  align-items: center;
}
.auth-links a {
  font-size: 16px;
  color: #333;
}

.main-container {
  max-width: 900px;
  margin: 30px auto;
  padding: 0 20px;
}

/* Watercolor Banner Card from Frame 1321317470 */
.banner-card {
  background: radial-gradient(circle, rgba(255,182,193,0.6) 0%, rgba(173,216,230,0.6) 50%, rgba(240,230,140,0.5) 100%);
  border-radius: 40px;
  padding: 35px 20px;
  text-align: center;
  margin-bottom: 40px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.03);
}
.banner-card h1 {
  font-size: 2.2rem;
  color: #222;
  margin-bottom: 15px;
  font-family: 'Georgia', serif;
}
.banner-search-box {
  display: flex;
  justify-content: center;
  align-items: center;
  max-width: 400px;
  margin: 0 auto;
  position: relative;
}
.banner-search-box input {
  width: 100%;
  padding: 8px 35px 8px 15px;
  border: 1px solid #aaa;
  border-radius: 20px;
  outline: none;
  font-size: 12px;
  background-color: rgba(255, 255, 255, 0.9);
}
.banner-search-box .search-icon {
  position: absolute;
  right: 12px;
  font-size: 12px;
  color: #666;
  pointer-events: none;
}

.section-heading {
  font-size: 1rem;
  font-weight: bold;
  margin-bottom: 25px;
  color: #333;
}

/* 3-Column Grid matching Frame 1321317470 */
.product-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
  margin-bottom: 50px;
}

.product-card {
  background: #fff;
  display: flex;
  flex-direction: column;
}
.product-card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 8px;
  background-color: #f5f5f5;
  margin-bottom: 10px;
}
.product-title {
  font-size: 12px;
  font-weight: bold;
  color: #222;
  margin-bottom: 3px;
}
.product-desc {
  font-size: 11px;
  color: #777;
  margin-bottom: 6px;
  line-height: 1.3;
}
.product-price {
  font-size: 11px;
  font-weight: bold;
  color: #222;
  margin-bottom: 8px;
}
.add-cart-btn {
  background-color: #333;
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  align-self: flex-start;
  transition: background 0.2s;
}
.add-cart-btn:hover {
  background-color: #000;
}

.cart-status {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #333;
  color: #fff;
  padding: 10px 18px;
  border-radius: 5px;
  display: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  font-size: 12px;
  z-index: 1000;
}

footer {
  background-color: #fff;
  padding: 40px 50px;
  border-top: 1px solid #eee;
  margin-top: 40px;
}
.footer-container {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
}
.footer-brand {
  display: flex;
  flex-direction: column;
  gap: 15px;
}
.footer-brand h3 {
  font-size: 14px;
  color: #333;
}
.social-icons {
  display: flex;
  gap: 10px;
  font-size: 12px;
  color: #666;
}
.footer-links {
  display: flex;
  gap: 60px;
}
.link-column {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.link-column h4 {
  font-size: 12px;
  color: #888;
  font-weight: normal;
  margin-bottom: 5px;
}
.link-column a {
  font-size: 12px;
  color: #555;
}

@media (max-width: 768px) {
  .product-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (max-width: 480px) {
  .product-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="19751.webp" alt="PetOra Logo" width="30" height="30">
  </div>

  <nav>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="product.html" class="active">Product</a></li>
      <li><a href="product.html">Categories</a></li>
      <li><a href="index.html#about">About Us</a></li>
    </ul>
  </nav>

  <div class="auth-links">
    <a href="#" title="User Account">👤</a>
    <a href="#" title="Shopping Cart">🛒</a>
  </div>
</header>

<main class="main-container">
  
  <div class="banner-card">
    <h1>PetOra</h1>
    <div class="banner-search-box">
      <input type="text" id="search-input" placeholder="Search product for your pets...">
      <span class="search-icon">🔍</span>
    </div>
  </div>

  <h2 class="section-heading">Related products</h2>

  <div class="product-grid" id="product-grid">
    <!-- Items dynamically injected via script.js -->
  </div>

</main>

<div id="cart-toast" class="cart-status">Item added to cart!</div>

<footer>
  <div class="footer-container">
    <div class="footer-brand">
      <h3>PetOra</h3>
      <div class="social-icons">
        <a href="#">🌐</a>
        <a href="#">📷</a>
        <a href="#">🐦</a>
        <a href="#">📘</a>
      </div>
    </div>

    <div class="footer-links">
      <div class="link-column">
        <h4>Subheading</h4>
        <a href="#">Link header</a>
        <a href="#">Link header</a>
        <a href="#">Link header</a>
      </div>
      <div class="link-column">
        <h4>Subheading</h4>
        <a href="#">Link header</a>
        <a href="#">Link header</a>
        <a href="#">Link header</a>
      </div>
      <div class="link-column">
        <h4>Subheading</h4>
        <a href="#">Link header</a>
        <a href="#">Link header</a>
        <a href="#">Link header</a>
      </div>
    </div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
